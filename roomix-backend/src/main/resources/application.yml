spring:
  application:
    name: homegpt-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:homegpt}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 5000ms

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

server:
  port: ${PORT:8080}
  servlet:
    context-path: /api/v1

app:
  jwt:
    secret: ${JWT_SECRET:your-super-secret-key-minimum-256-bits-long-change-in-production}
    access-token-expiry: 900        # 15 minutes en secondes
    refresh-token-expiry: 604800    # 7 jours en secondes

  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:19006}

  storage:
    provider: ${STORAGE_PROVIDER:supabase}
    bucket: ${STORAGE_BUCKET:homegpt-images}
    region: ${AWS_REGION:eu-west-3}
    access-key: ${AWS_ACCESS_KEY:}
    secret-key: ${AWS_SECRET_KEY:}
    endpoint: ${STORAGE_ENDPOINT:}

  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      base-url: https://api.openai.com/v1
      vision-model: gpt-4-vision-preview
      image-model: dall-e-3
      timeout: 60s
    replicate:
      api-key: ${REPLICATE_API_KEY:}
      base-url: https://api.replicate.com/v1
      sdxl-version: ${REPLICATE_SDXL_VERSION:}
      flux-version: ${REPLICATE_FLUX_VERSION:}
      timeout: 120s

  stripe:
    secret-key: ${STRIPE_SECRET_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
    premium-price-id: ${STRIPE_PREMIUM_PRICE_ID:}
    pro-price-id: ${STRIPE_PRO_PRICE_ID:}

  quota:
    free-daily-limit: 3
    premium-daily-limit: -1  # illimité

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.homegpt: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
