version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: homegpt-postgres
    environment:
      POSTGRES_DB: homegpt
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: homegpt-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  backend:
    build: .
    container_name: homegpt-backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: homegpt
      DB_USER: postgres
      DB_PASSWORD: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      REPLICATE_API_KEY: ${REPLICATE_API_KEY}
      REPLICATE_SDXL_VERSION: ${REPLICATE_SDXL_VERSION}
      STORAGE_PROVIDER: supabase
      STORAGE_BUCKET: ${STORAGE_BUCKET}
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT}
      AWS_ACCESS_KEY: ${SUPABASE_ACCESS_KEY}
      AWS_SECRET_KEY: ${SUPABASE_SECRET_KEY}
      AWS_REGION: eu-west-3
    ports:
      - "8080:8080"

volumes:
  postgres_data:
  redis_data:
